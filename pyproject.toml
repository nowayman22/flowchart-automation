[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "flowchart-automation"
version = "0.66.0"
description = "Visual, node-based automation tool for image/color/OCR-driven task flows."
readme = "README.md"
requires-python = ">=3.10"
license = { file = "LICENSE" }
authors = [{ name = "nowayman22" }]
keywords = ["automation", "flowchart", "tkinter", "opencv", "pyautogui"]
classifiers = [
    "Development Status :: 4 - Beta",
    "Environment :: X11 Applications",
    "Environment :: Win32 (MS Windows)",
    "Intended Audience :: End Users/Desktop",
    "License :: OSI Approved :: MIT License",
    "Operating System :: Microsoft :: Windows",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Topic :: Desktop Environment",
]
dependencies = [
    "opencv-python>=4.8",
    "numpy>=1.24",
    "pyautogui>=0.9.54",
    "keyboard>=0.13.5",
    "Pillow>=10.0",
    "pytesseract>=0.3.10",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0",
    "pytest-cov>=5.0",
    "ruff>=0.6",
    "mypy>=1.11",
    "pyinstaller>=6.0",
]

[project.scripts]
flowchart-automation = "flowchart_automation.__main__:main"

[project.urls]
Homepage = "https://github.com/nowayman22/flowchart-automation"
Issues = "https://github.com/nowayman22/flowchart-automation/issues"
Changelog = "https://github.com/nowayman22/flowchart-automation/blob/main/CHANGELOG.md"

[tool.setuptools.packages.find]
where = ["src"]

[tool.ruff]
line-length = 110
target-version = "py310"
extend-exclude = ["FlowchartClickerApp66.py"]  # legacy file — remove once refactor lands

[tool.ruff.lint]
select = ["E", "F", "W", "I", "UP", "B", "SIM", "RUF"]
ignore = ["E501"]  # line length handled by formatter

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-ra --strict-markers"
