name: CI

on:
  push:
    branches: [main]
    tags: ["v*"]
  pull_request:
    branches: [main]

jobs:
  lint-and-test:
    name: Lint & test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip

      - name: Install system deps for tkinter
        run: sudo apt-get update && sudo apt-get install -y python3-tk

      - name: Install package
        run: |
          python -m pip install --upgrade pip
          pip install -e ".[dev]"

      - name: Ruff check
        run: ruff check .

      - name: Ruff format check
        run: ruff format --check .

      - name: Pytest
        run: pytest --cov=flowchart_automation --cov-report=term-missing

  build-windows:
    name: Build Windows exe
    needs: lint-and-test
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip

      - name: Install package + PyInstaller
        run: |
          python -m pip install --upgrade pip
          pip install -e ".[dev]"

      - name: Build exe
        run: |
          pyinstaller --noconfirm --onefile --windowed `
            --name FlowchartAutomation `
            --icon Flow2.ico `
            --add-data "Flow2.ico;." `
            src/flowchart_automation/__main__.py

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: FlowchartAutomation-windows
          path: dist/FlowchartAutomation.exe

      - name: Attach to release
        uses: softprops/action-gh-release@v2
        with:
          files: dist/FlowchartAutomation.exe
